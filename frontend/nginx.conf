server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/catalog {
        proxy_pass http://catalog-service:5000/api/catalog;
    }

    location /api/watchlist {
        proxy_pass http://watchlist-service:5000/api/watchlist;
    }

    location /api/watchlist/ {
        proxy_pass http://watchlist-service:5000/api/watchlist/;
    }

    location /api/ratings {
        proxy_pass http://ratings-service:5000/api/ratings;
    }

    location /api/recommendations {
        proxy_pass http://recommendation-service:5000/api/recommendations;
    }
}